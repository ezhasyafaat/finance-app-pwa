services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finance
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/finance
      AUTH_SECRET: ${AUTH_SECRET:-change-me-to-a-long-random-string}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-gpt-4o-mini}
      NEXT_PUBLIC_CURRENCY: ${NEXT_PUBLIC_CURRENCY:-IDR}
      NEXT_PUBLIC_LOCALE: ${NEXT_PUBLIC_LOCALE:-id-ID}
    ports:
      - "3000:3000"

volumes:
  pgdata:
